name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore .NET dependencies
        run: dotnet restore CloudOps.sln
      - name: Build API and application
        run: dotnet build CloudOps.sln --configuration Release --no-restore
      - name: Run backend tests
        run: dotnet test CloudOps.sln --configuration Release --no-build
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: https://api.example.invalid/api
